services:
  postgres:
    image: postgres:17
    container_name: transmoney-postgres
    environment:
      POSTGRES_USER: transmoney_user
      POSTGRES_PASSWORD: transmoney_password
      POSTGRES_DB: transmoney_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: transmoney-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: