spring:
  application:
    name: transmoney-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/transmoney_db
    username: transmoney_user
    password: transmoney_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1500ms

server:
  port: 8080